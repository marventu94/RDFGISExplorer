<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RDF GIS Explorer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script>
    // Apply persisted theme before CSS loads to avoid a flash of incorrect theme.
    // Priority: explicit cookie choice > browser prefers-color-scheme > light.
    (function () {
      try {
        var m = document.cookie.match(/(?:^|;\s*)platform\.theme=(dark|light)/);
        var t = m ? m[1] : null;
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
