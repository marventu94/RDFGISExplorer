<div class="table-view-host">
  @if (!hasData()) {
    <div class="empty-state">
      <div class="empty-state-icon">&#x1F4CA;</div>
      <p>Ejecut&#xE1; una query para ver resultados</p>
    </div>
  } @else {
    @if (isTruncated()) {
      <div class="truncation-banner">
        {{ truncatedMessage() }}
      </div>
    }
    <div class="table-toolbar">
      <div class="toolbar-search">
        <mat-icon class="search-icon">search</mat-icon>
        <input
          class="search-input"
          placeholder="Buscar en todas las columnas…"
          [ngModel]="quickFilter()"
          (ngModelChange)="onQuickFilterChange($event)"
        />
        @if (quickFilter()) {
          <button class="search-clear" mat-icon-button (click)="onQuickFilterChange('')" aria-label="Limpiar">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <div class="page-size-selector">
        <span>Filas:</span>
        <select [ngModel]="pageSize()" (ngModelChange)="onPageSizeChange($event)">
          @for (size of pageSizeOptions(); track size) {
            <option [value]="size">{{ size }}</option>
          }
        </select>
      </div>

      <button
        mat-icon-button
        (click)="exportCsv()"
        title="Exportar el lote visible a CSV (para el resultado completo usá el botón del navbar)"
        aria-label="Exportar lote visible a CSV"
      >
        <mat-icon>download</mat-icon>
      </button>
    </div>
    <div class="grid-wrapper">
      <ag-grid-angular
        style="width: 100%; height: 100%"
        [class]="agThemeClass"
        [rowData]="rowData()"
        [columnDefs]="columnDefs()"
        [defaultColDef]="defaultColDef"
        [rowSelection]="rowSelection"
        [pagination]="true"
        [paginationPageSize]="pageSize()"
        [paginationPageSizeSelector]="false"
        [suppressPaginationPanel]="false"
        [domLayout]="'normal'"
        [quickFilterText]="quickFilter()"
        [tooltipShowDelay]="300"
        [tooltipInteraction]="true"
        (gridReady)="onGridReady($event)"
        (rowSelected)="onRowSelected($event)"
      ></ag-grid-angular>
    </div>
  }
</div>
