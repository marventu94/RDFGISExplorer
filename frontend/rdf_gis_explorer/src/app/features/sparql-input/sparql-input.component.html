<div class="sparql-input" (keydown)="$event.stopPropagation()">
  <div class="editor-area" #editorContainer></div>

  <div class="toolbar">
    <div class="toolbar-left">
      <button mat-button [matMenuTriggerFor]="tablerosMenu" (click)="loadDashboards()">
        <mat-icon>arrow_drop_down</mat-icon>
        Tableros
      </button>
      <mat-menu #tablerosMenu="matMenu" class="library-menu">
        <div class="menu-section-label">Predefinidas</div>
        @for (q of seedQueries; track q.id) {
          <button mat-menu-item (click)="loadSeedQuery(q)">
            <mat-icon>{{ getCategoryIcon(q.category) }}</mat-icon>
            <span>{{ q.name }}</span>
          </button>
        }
        <mat-divider />
        <div class="menu-section-label">Mis tableros</div>
        @if (loadingDashboards()) {
          <button mat-menu-item disabled>
            <mat-icon>hourglass_empty</mat-icon>
            <span>Cargando...</span>
          </button>
        } @else if (gisDashboards().length === 0) {
          <button mat-menu-item disabled>
            <mat-icon>info</mat-icon>
            <span>No hay tableros guardados</span>
          </button>
        } @else {
          @for (d of gisDashboards(); track d.id) {
            <button mat-menu-item (click)="loadDashboard(d)">
              <mat-icon>dashboard</mat-icon>
              <span>{{ d.name }}</span>
            </button>
          }
        }
        <mat-divider />
        <button mat-menu-item (click)="generateTestDashboard()">
          <mat-icon>add_circle</mat-icon>
          <span>Generar tablero de prueba</span>
        </button>
      </mat-menu>
    </div>

    <div class="toolbar-right">
      @if (executing()) {
        <mat-spinner diameter="24"></mat-spinner>
      }

      <button
        mat-button
        [matMenuTriggerFor]="limitMenu"
        [matBadge]="null"
        class="limit-btn"
      >
        {{ limitLabel(limit()) }}
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #limitMenu="matMenu">
        @for (opt of limitOptions; track opt) {
          <button mat-menu-item (click)="onLimitChange(opt)">
            <span [class.active-option]="limit() === opt">LIMIT {{ opt }}</span>
          </button>
        }
      </mat-menu>

      <button
        mat-flat-button
        color="primary"
        [disabled]="!hasContent() || executing()"
        (click)="execute()"
      >
        <mat-icon>play_arrow</mat-icon>
        Ejecutar
      </button>
    </div>
  </div>

  <app-field-mapping-panel
    [variables]="lastResult()?.variables ?? []"
    [bindings]="lastResult()?.bindings ?? []"
    [overridesCount]="overridesCount()"
    (applyMapping)="onApplyMapping($event)"
    (restoreAuto)="onRestoreAuto()"
  />
</div>
