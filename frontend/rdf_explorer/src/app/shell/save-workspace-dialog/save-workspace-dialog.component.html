<div class="dialog-container">
  <h3>Guardar workspace</h3>

  <label class="field">
    <span>Nombre</span>
    <input type="text" [(ngModel)]="name" placeholder="Mi consulta" [class.input-error]="hasNameConflict" />
    @if (hasNameConflict) {
      <span class="field-error">Ya existe un workspace con ese nombre.</span>
    }
  </label>

  @if (canOverwrite) {
    <div class="mode-selector">
      <label>
        <input type="radio" name="saveMode" value="overwrite" [(ngModel)]="mode" />
        Sobrescribir "{{ data.currentName }}"
      </label>
      <label>
        <input type="radio" name="saveMode" value="copy" [(ngModel)]="mode" />
        Guardar como copia
      </label>
    </div>
  }

  <div class="actions">
    <button class="btn-secondary" (click)="cancel()" type="button">Cancelar</button>
    <button class="btn-primary" (click)="save()" [disabled]="!canSave" type="button">Guardar</button>
  </div>
</div>
