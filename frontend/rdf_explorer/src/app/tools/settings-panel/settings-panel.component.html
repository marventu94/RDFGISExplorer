<h1 class="ta-center">Settings</h1>
<hr />

<h5>Endpoint configuration:</h5>
<form>
  <div class="form-row">
    <div class="form-group col-md-6">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Name:</span>
        <input class="form-control" type="text" name="endpointLabel" [(ngModel)]="endpointLabel" />
      </div>
    </div>
    <div class="form-group col-md-6">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Type:</span>
        <select class="custom-select" name="endpointType" [ngModel]="endpointType()" (ngModelChange)="onEndpointTypeChange($event)">
          <option value="other">Other</option>
          <option value="virtuoso">Virtuoso</option>
          <option value="fuseki">Fuseki</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-12">
      <div class="input-group input-group-sm">
        <span class="input-group-text">URL:</span>
        <input class="form-control" type="url" name="endpointUrl" placeholder="URI" [(ngModel)]="endpointUrl" />
      </div>
    </div>
  </div>
</form>

<h5>Search configuration:</h5>
<form>
  <div class="form-row">
    <div class="form-group col-md-12">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Class:</span>
        <input class="form-control" type="text" name="searchClass" autocomplete="off" placeholder="Write a class name to search"
          [ngModel]="searchClassValue()" (ngModelChange)="searchClassValue.set($event); onClassSearch($event)" />
      </div>
      @if (classResults().length > 0) {
        <div class="class-results">
          @for (result of classResults(); track result.uri) {
            <div class="class-result-item" (click)="selectClass(result.uri)">
              <span>{{ result.label }}</span>
              <br />
              <small class="text-muted">{{ result.uri }}</small>
            </div>
          }
        </div>
      }
    </div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-5">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Limit:</span>
        <input class="form-control" type="number" name="limit" [ngModel]="limit()" (ngModelChange)="limit.set($event)" />
      </div>
    </div>
  </div>

  <button class="btn btn-info btn-sm" type="button" (click)="resetToDefault()">Default</button>
  <button class="btn btn-primary btn-sm pull-right" type="button" (click)="save()">Save</button>
  <button class="btn btn-warning btn-sm pull-right" type="button" (click)="cancel()" style="margin-right: 10px;">Cancel</button>
</form>
