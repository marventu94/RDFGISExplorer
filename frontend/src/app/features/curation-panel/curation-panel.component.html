<div class="panel-header">
  <h2 class="panel-title">
    @if (node(); as n) {
      Detalle de {{ n.label }}
    } @else {
      Sin selección
    }
  </h2>
  <button mat-icon-button (click)="closePanel()" aria-label="Cerrar panel">
    <mat-icon>close</mat-icon>
  </button>
</div>

@if (loading()) {
  <div class="panel-loading">
    <mat-spinner diameter="32" />
  </div>
}

<mat-tab-group [hidden]="loading()">
  <mat-tab label="Datos">
    <app-data-tab
      [node]="node()"
      [records]="records()"
      (recordChanged)="onRecordChanged()"
    />
  </mat-tab>

  <mat-tab label="Plugin">
    <div class="plugin-tab-empty">
      <mat-icon>extension</mat-icon>
      <span>Sin plugins instalados</span>
    </div>
  </mat-tab>
</mat-tab-group>
