services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file: ${ENV_FILE:-.env}
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend/app_shell
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

  rdf-explorer:
    build:
      context: ./frontend/rdf_explorer
      dockerfile: Dockerfile
    ports:
      - "${RDF_EXPLORER_PORT:-4201}:80"
    depends_on:
      backend:
        condition: service_healthy

  rdf-gis-explorer:
    build:
      context: ./frontend/rdf_gis_explorer
      dockerfile: Dockerfile
    ports:
      - "${RDF_GIS_EXPLORER_PORT:-4202}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
