services:
  shell-backend:
    build:
      context: .
      dockerfile: products/shell/backend/Dockerfile
    environment:
      SHELL_BACKEND_PORT: 3000
    ports: ["${SHELL_BACKEND_PORT:-3000}:3000"]
    volumes:
      - shell-data:/repo/products/shell/backend/data

  rdf-backend:
    build:
      context: .
      dockerfile: packages/explorer-backend/Dockerfile
    env_file: ${RDF_ENV_FILE:-.env}
    environment:
      BACKEND_PORT: 3001
    ports: ["${RDF_EXPLORER_BACKEND_PORT:-3001}:3001"]

  gis-backend:
    build:
      context: .
      dockerfile: packages/explorer-backend/Dockerfile
    env_file: ${GIS_ENV_FILE:-.env}
    environment:
      BACKEND_PORT: 3002
    ports: ["${GIS_EXPLORER_BACKEND_PORT:-3002}:3002"]

  shell:
    build:
      context: .
      dockerfile: products/shell/frontend/Dockerfile
    ports: ["${FRONTEND_PORT:-4200}:80"]
    depends_on: [shell-backend, rdf-backend, gis-backend]

  rdf-explorer:
    build:
      context: .
      dockerfile: products/rdf-explorer/frontend/Dockerfile
    ports: ["${RDF_EXPLORER_PORT:-4201}:80"]
    depends_on: [rdf-backend]

  gis-explorer:
    build:
      context: .
      dockerfile: products/gis-explorer/frontend/Dockerfile
    ports: ["${RDF_GIS_EXPLORER_PORT:-4202}:80"]
    depends_on: [gis-backend]

volumes:
  shell-data:
