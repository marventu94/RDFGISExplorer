<div class="dialog-container">
  <h3>{{ 'Guardar tablero' | translate }}</h3>

  <label class="field">
    <span>{{ 'Nombre del tablero' | translate }}</span>
    <span class="input-wrapper">
      <input
        type="text"
        [ngModel]="name()"
        (ngModelChange)="onNameChange($event)"
        [attr.placeholder]="'Ej: Mis ciudades argentinas' | translate"
        [class.input-error]="hasConflict() && mode() === 'copy'"
      />
      @if (checking()) {
        <mat-icon class="checking-icon">hourglass_empty</mat-icon>
      }
    </span>
  </label>

  @if (hasConflict()) {
    <div class="conflict-message" [class.conflict-warning]="mode() === 'overwrite'" [class.conflict-error]="mode() === 'copy'">
      <mat-icon>{{ mode() === 'overwrite' ? 'warning' : 'error' }}</mat-icon>
      <span>{{ conflictMessage }}</span>
    </div>
  }

  @if (showModeOptions) {
    <div class="mode-selector">
      <label>
        <input
          type="radio"
          name="saveMode"
          value="overwrite"
          [checked]="mode() === 'overwrite'"
          (change)="mode.set('overwrite')"
        />
          {{ 'Sobreescribir existente' | translate }}
      </label>
      <label>
        <input
          type="radio"
          name="saveMode"
          value="copy"
          [checked]="mode() === 'copy'"
          (change)="mode.set('copy')"
        />
          {{ 'Guardar como copia' | translate }}
      </label>
    </div>
  }

  <div class="actions">
    <button class="btn-secondary" type="button" (click)="onCancel()">{{ 'Cancelar' | translate }}</button>
    <button class="btn-primary" type="button" [disabled]="!canSave" (click)="onSave()">
      {{ 'Guardar' | translate }}
    </button>
  </div>
</div>
