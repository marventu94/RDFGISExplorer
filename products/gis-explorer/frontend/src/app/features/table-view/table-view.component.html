<div class="table-view-host">
  @if (!hasData()) {
    <div class="empty-state">
      <div class="empty-state-icon">&#x1F4CA;</div>
      <p>{{ 'Ejecutá una query para ver resultados' | translate }}</p>
    </div>
  } @else {
    @if (isTruncated()) {
      <div class="truncation-banner">
        {{ truncatedMessage() }}
      </div>
    }
    <div class="table-toolbar">
      <div class="toolbar-search">
        <mat-icon class="search-icon">search</mat-icon>
        <input
          class="search-input"
          [attr.placeholder]="'Buscar en todas las columnas…' | translate"
          [ngModel]="quickFilter()"
          (ngModelChange)="onQuickFilterChange($event)"
        />
        @if (quickFilter()) {
          <button class="search-clear" mat-icon-button (click)="onQuickFilterChange('')" [attr.aria-label]="'Limpiar' | translate">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <div class="page-size-selector">
        <span>{{ 'Filas:' | translate }}</span>
        <select [ngModel]="pageSize()" (ngModelChange)="onPageSizeChange($event)">
          @for (size of pageSizeOptions(); track size) {
            <option [value]="size">{{ size }}</option>
          }
        </select>
      </div>
    </div>
    <div class="grid-wrapper">
      <ag-grid-angular
        style="width: 100%; height: 100%"
        [class]="agThemeClass"
        [rowData]="rowData()"
        [columnDefs]="columnDefs()"
        [defaultColDef]="defaultColDef"
        [rowSelection]="rowSelection"
        [pagination]="true"
        [paginationPageSize]="pageSize()"
        [paginationPageSizeSelector]="false"
        [suppressPaginationPanel]="false"
        [domLayout]="'normal'"
        [quickFilterText]="quickFilter()"
        [localeText]="gridLocale()"
        [tooltipShowDelay]="300"
        [tooltipInteraction]="true"
        (gridReady)="onGridReady($event)"
        (rowDataUpdated)="onRowDataUpdated()"
        (rowSelected)="onRowSelected($event)"
      ></ag-grid-angular>
    </div>
  }
</div>
