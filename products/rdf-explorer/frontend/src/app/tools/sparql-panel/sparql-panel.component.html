<header class="panel-heading"><h3>{{ 'Consultas SPARQL' | translate }}</h3></header>
@if (queries().length === 0) {
  <p class="empty-state">{{ 'La configuración actual no genera consultas.' | translate }}</p>
}
@for (query of queries(); track $index; let i = $index) {
  <section class="query-block">
    <button class="query-toggle" type="button" (click)="toggleQuery(i)"
      [attr.aria-expanded]="isQueryShown(i)" [attr.aria-controls]="'sparql-query-' + i"
      [attr.title]="(isQueryShown(i) ? 'Minimizar consulta' : 'Expandir consulta') | translate">
      <svg class="chevron" [class.expanded]="isQueryShown(i)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      <strong>{{ 'Consulta' | translate }} {{ i + 1 }}</strong>
    </button>
    <div class="query-variables">
      @for (res of query.select; track res.id) {
        <button class="query-chip" type="button" [style.border-left-color]="getColor(res)" (click)="onClickResource(res)">
          {{ res.getRepr() }}
        </button>
      }
    </div>
    @if (isQueryShown(i)) {
      <div class="query-content" [id]="'sparql-query-' + i"><sparql-viewer [content]="getSparql(query)" /></div>
    }
  </section>
}
