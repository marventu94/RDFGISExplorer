<div class="dialog-container">
  <h3>{{ 'Guardar workspace' | translate }}</h3>

  <label class="field">
    <span>{{ 'Nombre' | translate }}</span>
    <input type="text" [(ngModel)]="name" [attr.placeholder]="'Mi consulta' | translate" [class.input-error]="hasNameConflict" />
    @if (hasNameConflict) {
      <span class="field-error">{{ 'Ya existe un workspace con ese nombre.' | translate }}</span>
    }
  </label>

  @if (canOverwrite) {
    <div class="mode-selector">
      <label>
        <input type="radio" name="saveMode" value="overwrite" [ngModel]="mode" (ngModelChange)="setMode($event)" />
        Sobrescribir "{{ data.currentName }}"
      </label>
      <label>
        <input type="radio" name="saveMode" value="copy" [ngModel]="mode" (ngModelChange)="setMode($event)" />
        {{ 'Guardar como copia' | translate }}
      </label>
    </div>
  }

  <div class="actions">
    <button class="btn-secondary" (click)="cancel()" type="button">{{ 'Cancelar' | translate }}</button>
    <button class="btn-primary" (click)="save()" [disabled]="!canSave" type="button">{{ 'Guardar' | translate }}</button>
  </div>
</div>
