packages:
  - 'packages/*'
  - 'backend'
  - 'frontend/app_shell'
  - 'frontend/rdf_explorer'
  - 'frontend/rdf_gis_explorer'

allowBuilds:
  '@nestjs/core': true
  better-sqlite3: true
  unrs-resolver: true
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

patchedDependencies:
  '@softarc/native-federation@3.5.5': 'frontend/rdf_gis_explorer/patches/@softarc__native-federation@3.5.5.patch'
